<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>预览 · 健康档案</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="css/style.css">
<style>
  /* 只属于开发预览页的那一条 */
  body { padding-top: 30px; }
  #devbar {
    position: fixed; inset: 0 0 auto 0; height: 30px; z-index: 99;
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
    font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted); background: var(--card); border-bottom: 1px solid var(--line);
  }
  #devbar b { color: var(--green); font-weight: 600; letter-spacing: .06em; }
  #devbar .sep { color: var(--line); }
  #devbar .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 8px var(--glow-1);
  }
  #devbar .dot.off { background: var(--dim); box-shadow: none; }
  #devbar .sp { flex: 1; }
  #devbar a { color: var(--blue); text-decoration: none; }
  #devbar button {
    font: inherit; color: var(--muted); background: var(--btn-bg); border: 1px solid var(--btn-line);
    border-radius: 5px; padding: 2px 8px; cursor: pointer;
  }
  #devbar button:hover { color: var(--text); border-color: var(--dim); }
  #devmsg {
    max-width: 980px; margin: 60px auto; padding: 24px;
    border: 1px solid var(--line); border-radius: 12px; color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
    white-space: pre-wrap; line-height: 1.7;
  }
</style>
</head>
<body>

<div id="devbar">
  <span class="dot" id="dot"></span>
  <b>LIVE</b>
  <span class="sep">|</span>
  <span id="dbsrc">out/report.json</span>
  <span class="sep">|</span>
  <span id="dbstat">加载中…</span>
  <span class="sp"></span>
  <span id="dbtime"></span>
  <button id="theme" class="theme-toggle mini" type="button" aria-label="切换深浅色">
    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14.6A8.4 8.4 0 0 1 9.4 3.6a8.4 8.4 0 1 0 11 11Z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.4 12H2.2M21.8 12h-2.2M6.6 6.6 5 5M19 19l-1.6-1.6M6.6 17.4 5 19M19 5l-1.6 1.6"/></svg>
  </button>
  <button id="dbcopy" type="button" title="复制页面地址">复制地址</button>
  <a href="./" target="_blank" rel="noopener">正式页</a>
</div>

<div id="devmsg" hidden></div>

<main id="app" hidden>
  <section id="report">
    <div class="report-head">
      <div>
        <h2 id="rtitle">报告</h2>
        <p id="rsub" class="muted"></p>
      </div>
      <span class="muted" style="font-size:12px">预览数据 · 非真实上传</span>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="view" class="view"></div>
  </section>
</main>

<script type="module">
import { renderReport, renderTab } from './js/report.js';
import { initTheme } from './js/theme.js';

initTheme(document.getElementById('theme'));

const $ = id => document.getElementById(id);
const KEYS = ['overview', 'audio', 'heart', 'sleep', 'activity', 'devices'];
const MEM = 'preview:state';

let ui = null;

function fail(msg) {
  const box = $('devmsg');
  box.hidden = false;
  box.textContent = msg;
  $('dbstat').textContent = '没有数据';
  $('dot').classList.add('off');
}

function remember() {
  if (!ui) return;
  try {
    const cur = document.querySelector('#tabs button[aria-selected="true"]');
    sessionStorage.setItem(MEM, JSON.stringify({
      k: cur ? cur.dataset.k : 'overview',
      y: Math.round(window.scrollY),
    }));
  } catch {}
}

function restore() {
  // ?tab=heart 直接落在那页，优先于上次停留的位置（截图和分享用）
  const q = new URLSearchParams(location.search).get('tab');
  if (q && KEYS.includes(q)) {
    document.querySelectorAll('#tabs button').forEach(b =>
      b.setAttribute('aria-selected', String(b.dataset.k === q)));
    renderTab(q, ui);
    return;
  }
  let s = null;
  try { s = JSON.parse(sessionStorage.getItem(MEM) || 'null'); } catch {}
  if (!s) return;
  if (s.k && KEYS.includes(s.k)) {
    document.querySelectorAll('#tabs button').forEach(b =>
      b.setAttribute('aria-selected', String(b.dataset.k === s.k)));
    renderTab(s.k, ui);
  }
  if (s.y > 0) requestAnimationFrame(() => window.scrollTo(0, s.y));
}

async function boot() {
  let r;
  try {
    const res = await fetch('out/report.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    r = await res.json();
  } catch (e) {
    fail(
      '读不到 out/report.json。\n\n' +
      '先在项目根目录跑一次：\n' +
      '  node tools/parse-local.mjs <你的导出.zip>\n\n' +
      '它会写出一份解析结果，这个页面就靠它渲染。\n\n' +
      '原始错误：' + e.message
    );
    return;
  }

  $('app').hidden = false;
  ui = { title: $('rtitle'), sub: $('rsub'), tabs: $('tabs'), view: $('view') };
  renderReport(r, ui);

  // 每次渲染完把 tab 变更写回 sessionStorage，重载时原地站着
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]');
    if (b) { try { sessionStorage.setItem(MEM, JSON.stringify({ k: b.dataset.k, y: 0 })); } catch {} }
  });
  window.addEventListener('beforeunload', remember);

  restore();

  const total = Object.values(r.counts).reduce((a, b) => a + b, 0);
  $('dbstat').textContent = r.meta.lines.toLocaleString('en-US') + ' 行 · ' +
    total.toLocaleString('en-US') + ' 条 · ' + (r.meta.ms / 1000).toFixed(1) + ' s';
  $('dbtime').textContent = '本地 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
}

$('dbcopy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(location.href); $('dbcopy').textContent = '已复制'; }
  catch { $('dbcopy').textContent = location.href; }
  setTimeout(() => { $('dbcopy').textContent = '复制地址'; }, 1600);
});

// 文件一变就重载；连不上说明 dev.mjs 没在跑，页面本身照常可看
// ?noes=1 关掉长连接：headless 截图要求网络静默，SSE 会让它永远等下去
if (location.search.indexOf('noes') < 0) try {
  const es = new EventSource('/__reload');
  es.onopen = () => $('dot').classList.remove('off');
  es.onerror = () => $('dot').classList.add('off');
  es.onmessage = e => { remember(); location.reload(); };
} catch {}

boot();
</script>
</body>
</html>
